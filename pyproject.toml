[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "fb-robot"
version = "0.1.0"
description = "Facebook 社團貼文抓取與 PostgreSQL 寫入（Apify + SimHash 跨社團去重）"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "apify-client>=1.8",
    "psycopg2-binary>=2.9",
    "python-dotenv>=1.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "ruff>=0.6",
]
# LLM 貼文分類（fb-robot classify）；只用抓取/寫入功能時不必安裝
classify = [
    "openai>=1.40",
    "jsonschema>=4.21",
]

[project.scripts]
fb-robot = "fb_robot.cli:main"

[tool.setuptools.package-data]
# DDL、prompt 與輸出 Schema 要跟著套件一起裝（classify 用 importlib.resources 讀取）
"fb_robot.classify" = ["*.sql", "prompts/*/*.txt", "prompts/*/*.json"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-q"

[tool.ruff]
line-length = 120
target-version = "py310"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.ruff.lint.per-file-ignores]
# schema.py 以單行 SQL COMMENT 陳述句為主，維持一行一句可讀性較高
"src/fb_robot/upsert/schema.py" = ["E501"]
"src/fb_robot/upsert/sql.py" = ["E501"]
